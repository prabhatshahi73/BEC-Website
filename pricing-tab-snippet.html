<!-- ===== BEC "Buy services online" tab and banner =====
HOW TO USE: paste this whole block just before </body> in index.html
(and in ec-calculator.html, news.html, etc. to show it on every page).
It adds (1) a big gold tab on the right edge, and (2) a banner placed above
your #services section. Nothing else on the page is changed. -->
<style>
.becx-tab{position:fixed;right:0;top:48%;z-index:900;transform:translateY(-50%);background:#c9a63f;color:#1b1500;text-decoration:none;font:700 15px/1.2 "Public Sans",system-ui,sans-serif;padding:18px 12px;border-radius:12px 0 0 12px;box-shadow:-4px 6px 18px rgba(0,0,0,.35);writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:.02em}
.becx-tab:hover,.becx-tab:focus-visible{background:#e3bf4f;padding-right:18px}
.becx-tab:focus-visible,.becx-ban a:focus-visible{outline:3px solid #fff;outline-offset:2px}
.becx-ban{background:#0b3b17;color:#f2f6f3;padding:40px 20px;font-family:"Public Sans",system-ui,sans-serif}
.becx-in{max-width:1100px;margin:auto;display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;justify-content:space-between}
.becx-ban h2{margin:0 0 8px;font-size:clamp(1.5rem,3.4vw,2.3rem);line-height:1.15;color:#fff}
.becx-ban p{margin:0;max-width:52ch;color:#cfe3d5}
.becx-btns{display:flex;flex-wrap:wrap;gap:12px}
.becx-ban a{display:inline-block;padding:14px 22px;border-radius:10px;text-decoration:none;font-weight:700}
.becx-a{background:#c9a63f;color:#1b1500}.becx-b{border:2px solid #c9a63f;color:#fff}
.becx-a:hover{background:#e3bf4f}.becx-b:hover{background:rgba(201,166,63,.18)}
@media(max-width:700px){.becx-tab{writing-mode:horizontal-tb;top:auto;bottom:14px;right:14px;transform:none;border-radius:99px;padding:14px 20px}}
</style>
<a class="becx-tab" href="services-pricing.html" aria-label="Buy environmental services online">Buy services online</a>
<section class="becx-ban" id="becx-banner" aria-label="Buy services online"><div class="becx-in">
<div><h2>Buy compliance, carbon and ESG services online</h2><p>Fixed starting prices, personalised reports and documents for your site, and a reply with scope and quote within one working day.</p></div>
<div class="becx-btns"><a class="becx-a" href="services-pricing.html">Services for India (INR)</a><a class="becx-b" href="services-pricing.html#international">International clients (USD)</a></div>
</div></section>

(function(){var b=document.getElementById("becx-banner"),t=document.getElementById("services");
if(b&&t&&t.parentNode)t.parentNode.insertBefore(b,t);})();
