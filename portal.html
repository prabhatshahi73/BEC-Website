<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal | Bharat Environment Consultants</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g:#0d3b1e;--g2:#1a5c32;--gold:#c9a84c;--cream:#f8f5ef;--ink:#1c1c1c;--mute:#5a5a5a;--line:#e0dccf}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "DM Sans",system-ui,sans-serif;background:var(--cream);color:var(--ink)}
h1,h2,h3{font-family:"Cormorant Garamond",serif;color:var(--g);margin:0}
header{background:var(--g);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:2px solid var(--gold)}
header a{color:#fff;text-decoration:none;font:700 1.15rem "Cormorant Garamond",serif}header small{color:var(--gold);display:block;font:500 .7rem "DM Sans"}
.who{display:flex;gap:12px;align-items:center;font-size:.85rem}
main{max-width:1100px;margin:auto;padding:28px 5vw 60px}
.btn{background:var(--gold);color:var(--g);border:0;border-radius:6px;padding:10px 18px;font:700 .88rem "DM Sans";cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}header .btn.o{color:#fff;border-color:rgba(255,255,255,.4)}
:focus-visible{outline:3px solid var(--g2);outline-offset:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
.auth{max-width:440px;margin:30px auto}.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font:600 .85rem "DM Sans";cursor:pointer}
.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
label{display:grid;gap:4px;font-size:.78rem;font-weight:600;color:var(--mute);margin-bottom:12px}
input,select,textarea{padding:10px;border:1.5px solid var(--line);border-radius:6px;font:inherit;background:#fff;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.msg{padding:10px 12px;border-radius:6px;background:#fff4d6;font-size:.85rem;margin-bottom:12px}.msg.ok{background:#dff3e4}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--g);color:#fff;border-radius:10px;padding:16px}.stat b{font:700 2rem "Cormorant Garamond";color:var(--gold);display:block}
table{width:100%;border-collapse:collapse;font-size:.86rem}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}th{color:var(--mute);font-size:.72rem}
tr.c{cursor:pointer}tr.c:hover{background:#f2efe4}.wrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:#e8efe9;color:var(--g2);font-size:.75rem;font-weight:600}
.pill.paid{background:#dff3e4}.pill.no{background:#f3e6e6;color:#8a2a2a}
.tl{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.tl span{padding:4px 10px;border-radius:99px;background:#eee;font-size:.74rem;color:var(--mute)}.tl span.d{background:var(--g2);color:#fff}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto;z-index:20}
#ov.on{display:flex}#md{background:#fff;border-radius:12px;padding:24px;width:min(640px,100%)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:.88rem;margin:10px 0}.kv b{color:var(--mute);font-weight:600}
.demo{background:#fff4d6;text-align:center;padding:8px;font-size:.8rem}
@media(max-width:560px){.row2{grid-template-columns:1fr}}
</style></head><body>
<div id="demo" class="demo" hidden>Demo mode: data stays in this browser only. Connect Firebase to go live. Demo admin: admin@demo.local / admin123</div>
<header><a href="https://bharatenvironmentconsultants.com/">Bharat Environment Consultants<small>Client and Application Portal</small></a><div class="who" id="who"></div></header>
<main id="app"></main>
<div id="ov"><div id="md" role="dialog" aria-modal="true"></div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===== SETUP: paste your Firebase web config here (empty = demo mode) ===== */
const CFG={apiKey:"",authDomain:"",projectId:"",appId:""};
const ADMINS=["admin@demo.local"]; // your administrator email(s), lowercase. Must match firestore.rules
const NOTIFY="https://formspree.io/f/xzdyqpya"; // emails you when a client submits
const SERVICES=["Environment Audit","CTE application","CTO application","Compliance document pack","ISO 14001 / 45001 registers","Consent applicability check","Carbon footprint report","GHG inventory (ISO 14064-1)","BRSR / ESG readiness","EU CBAM readiness","Product carbon footprint / LCA","EPR registration","Environmental due diligence","IFC PS / Equator gap analysis","ESIA / EIA support","Other"];
const ST=["Submitted","Under scrutiny","Query raised","Quote sent","Payment received","In progress","Delivered"];
const $=s=>document.querySelector(s),e=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=n=>new Date(n).toLocaleDateString("en-IN");
let API,U=null,S={tab:"login",msg:"",expect:""};
/* ---- Firebase backend ---- */
const FB={init(){firebase.initializeApp(CFG);this.a=firebase.auth();this.d=firebase.firestore()},
on(cb){this.a.onAuthStateChanged(u=>cb(u?{uid:u.uid,email:u.email,admin:ADMINS.includes((u.email||"").toLowerCase())}:null))},
async signUp(p){const c=await this.a.createUserWithEmailAndPassword(p.email,p.pw);await this.d.collection("users").doc(c.user.uid).set({name:p.name,org:p.org,phone:p.phone,email:p.email})},
signIn(m,p){return this.a.signInWithEmailAndPassword(m,p)},signOut(){return this.a.signOut()},
async profile(uid){const s=await this.d.collection("users").doc(uid).get();return s.exists?s.data():{}},
createApp(a){return this.d.collection("applications").doc(a.id).set(a)},
async list(uid){const q=uid?this.d.collection("applications").where("uid","==",uid):this.d.collection("applications");return(await q.get()).docs.map(x=>x.data()).sort((a,b)=>b.created-a.created)},
update(id,p){return this.d.collection("applications").doc(id).update(p)},
async delivery(id){try{const s=await this.d.collection("deliveries").doc(id).get();return s.exists?s.data():null}catch(x){return null}},
setDelivery(id,uid,link){return this.d.collection("deliveries").doc(id).set({link,uid})}};
/* ---- Demo backend (browser only) ---- */
const DB=()=>JSON.parse(localStorage.getItem("becp")||'{"users":[{"uid":"A","email":"admin@demo.local","pw":"admin123","name":"Administrator"}],"apps":[],"del":{}}');
const SV=d=>localStorage.setItem("becp",JSON.stringify(d));
const DM={init(){},on(cb){this.cb=cb;const s=localStorage.getItem("becs");const u=s&&DB().users.find(x=>x.uid===s);cb(u?this.u(u):null)},
u:x=>({uid:x.uid,email:x.email,admin:ADMINS.includes(x.email.toLowerCase())}),
async signUp(p){const d=DB();if(d.users.some(x=>x.email===p.email))throw{message:"This email is already registered."};const u={uid:"U"+Date.now(),email:p.email,pw:p.pw,name:p.name,org:p.org,phone:p.phone};d.users.push(u);SV(d);localStorage.setItem("becs",u.uid);this.cb(this.u(u))},
async signIn(m,p){const u=DB().users.find(x=>x.email===m&&x.pw===p);if(!u)throw{message:"Email or password is incorrect."};localStorage.setItem("becs",u.uid);this.cb(this.u(u))},
async signOut(){localStorage.removeItem("becs");this.cb(null)},
async profile(uid){return DB().users.find(x=>x.uid===uid)||{}},
async createApp(a){const d=DB();d.apps.push(a);SV(d)},
async list(uid){return DB().apps.filter(x=>!uid||x.uid===uid).sort((a,b)=>b.created-a.created)},
async update(id,p){const d=DB();Object.assign(d.apps.find(x=>x.id===id),p);SV(d)},
async delivery(id){const d=DB(),a=d.apps.find(x=>x.id===id);return a&&a.paid?d.del[id]||null:(U&&U.admin?d.del[id]||null:null)},
async setDelivery(id,uid,link){const d=DB();d.del[id]={link,uid};SV(d)}};
/* ---- Screens ---- */
function go(){if(U&&S.expect==="admin"&&!U.admin){S.msg="This account is not an administrator.";S.expect="";API.signOut();return}
S.expect="";$("#who").innerHTML=U?`<span>${e(U.email)}${U.admin?" (Administrator)":""}</span><button class="btn o" id="out">Sign out</button>`:"";
U?(U.admin?adminScreen():clientScreen()):authScreen()}
function authScreen(){const t=S.tab,su=t==="signup";$("#app").innerHTML=`<div class="card auth"><h2>${su?"Create client account":t==="admin"?"Administrator login":"Client login"}</h2><div class="tabs" style="margin-top:14px"><button data-t="login" class="${t==="login"?"on":""}">Client login</button><button data-t="signup" class="${su?"on":""}">Sign up</button><button data-t="admin" class="${t==="admin"?"on":""}">Administrator</button></div>${S.msg?`<div class="msg">${e(S.msg)}</div>`:""}
<form id="af">${su?`<div class="row2"><label>Full name<input name="name" required></label><label>Organisation<input name="org" required></label></div><label>Mobile<input name="phone" type="tel" required></label>`:""}<label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password${su?" (min 8 characters)":""}<input name="pw" type="password" required minlength="${su?8:1}" autocomplete="${su?"new-password":"current-password"}"></label><button class="btn" style="width:100%">${su?"Create account":"Sign in"}</button></form></div>`}
function stat(a){const i=ST.indexOf(a.status);return`<div class="tl">${ST.map((s,k)=>`<span class="${k<=i?"d":""}">${s}</span>`).join("")}</div>`}
async function clientScreen(){const p=await API.profile(U.uid),ap=await API.list(U.uid);window.AP=ap;
$("#app").innerHTML=`<h2>Welcome${p.name?", "+e(p.name):""}</h2><p style="color:var(--mute)">Submit an application, track its status and download your documents once payment is confirmed.</p>
<div class="card"><h3>New application</h3><form id="nf" style="margin-top:12px"><div class="row2"><label>Service<select name="service" required>${SERVICES.map(s=>`<option>${e(s)}</option>`).join("")}</select></label><label>State of project or site<input name="state" required></label></div><div class="row2"><label>Industry category<select name="category"><option>Not sure</option><option>Red</option><option>Orange</option><option>Green</option><option>White</option></select></label><label>Link to your documents (Drive, optional)<input name="docs" type="url" placeholder="https://"></label></div><label>Project details and what you need<textarea name="details" rows="4" required></textarea></label><button class="btn">Submit application</button></form></div>
<div class="card"><h3>My applications</h3><div class="wrap">${ap.length?`<table><tr><th>ID</th><th>Date</th><th>Service</th><th>Status</th><th>Payment</th></tr>${ap.map(a=>`<tr class="c" data-v="${e(a.id)}"><td>${e(a.id)}</td><td>${dt(a.created)}</td><td>${e(a.service)}</td><td><span class="pill">${e(a.status)}</span></td><td><span class="pill ${a.paid?"paid":"no"}">${a.paid?"Paid":"Pending"}</span></td></tr>`).join("")}</table>`:"<p>No applications yet.</p>"}</div></div>`;
if(S.msg){$("#app").insertAdjacentHTML("afterbegin",`<div class="msg ok">${e(S.msg)}</div>`);S.msg=""}}
async function adminScreen(){const ap=await API.list(null);window.AP=ap;const f=S.f||"",q=(S.q||"").toLowerCase(),n=s=>ap.filter(a=>a.status===s).length;
const rows=ap.filter(a=>(!f||a.status===f)&&(a.id+a.name+a.org+a.service+a.email).toLowerCase().includes(q));
$("#app").innerHTML=`<h2>Administrator dashboard</h2><div class="stats" style="margin-top:14px"><div class="stat"><b>${ap.length}</b>All applications</div><div class="stat"><b>${n("Submitted")}</b>New</div><div class="stat"><b>${ap.filter(a=>["Under scrutiny","Query raised","Quote sent","In progress"].includes(a.status)).length}</b>In process</div><div class="stat"><b>${ap.filter(a=>a.paid).length}</b>Paid</div><div class="stat"><b>${n("Delivered")}</b>Delivered</div></div>
<div class="card"><div class="row2" style="margin-bottom:12px"><label>Search<input id="aq" value="${e(S.q||"")}" placeholder="ID, client, service"></label><label>Status<select id="af2"><option value="">All</option>${ST.map(s=>`<option ${s===f?"selected":""}>${s}</option>`).join("")}</select></label></div><div class="wrap">${rows.length?`<table><tr><th>ID</th><th>Date</th><th>Client</th><th>Service</th><th>Status</th><th>Quote</th><th>Paid</th></tr>${rows.map(a=>`<tr class="c" data-v="${e(a.id)}"><td>${e(a.id)}</td><td>${dt(a.created)}</td><td>${e(a.name)}<br><small>${e(a.org)}</small></td><td>${e(a.service)}</td><td><span class="pill">${e(a.status)}</span></td><td>${e(a.quote||"")}</td><td><span class="pill ${a.paid?"paid":"no"}">${a.paid?"Yes":"No"}</span></td></tr>`).join("")}</table>`:"<p>No applications match.</p>"}</div></div>`}
async function detail(id){const a=window.AP.find(x=>x.id===id);if(!a)return;const dl=await API.delivery(id);
const kv=`<div class="kv"><b>Application</b><span>${e(a.id)}, ${dt(a.created)}</span><b>Client</b><span>${e(a.name)}, ${e(a.org)}<br>${e(a.email)}, ${e(a.phone)}</span><b>Service</b><span>${e(a.service)}</span><b>State, category</b><span>${e(a.state)}, ${e(a.category)}</span><b>Details</b><span style="white-space:pre-wrap">${e(a.details)}</span><b>Documents</b><span>${/^https:\/\//.test(a.docs||"")?`<a href="${e(a.docs)}" target="_blank" rel="noopener">Open link</a>`:"None"}</span></div>`;
$("#md").innerHTML=U.admin?`<h3>${e(a.service)}</h3>${kv}<form id="uf" data-id="${e(a.id)}" data-uid="${e(a.uid)}"><div class="row2"><label>Status<select name="status">${ST.map(s=>`<option ${s===a.status?"selected":""}>${s}</option>`).join("")}</select></label><label>Quote (with currency)<input name="quote" value="${e(a.quote||"")}"></label></div><label>Remarks or query for the client<textarea name="remarks" rows="3">${e(a.remarks||"")}</textarea></label><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="paid" ${a.paid?"checked":""}> Payment received</label><label>Private file link for the client (Drive, OneDrive, Dropbox)<input name="link" type="url" value="${e(dl?dl.link:"")}" placeholder="https://"></label><button class="btn">Save</button> <button type="button" class="btn o" id="cl">Close</button></form>`
:`<h3>${e(a.service)}</h3>${stat(a)}${kv}${a.remarks?`<div class="msg"><b>Message from BEC:</b> ${e(a.remarks)}</div>`:""}${a.quote?`<p><b>Quote:</b> ${e(a.quote)}</p>`:""}<div class="msg ${a.paid&&dl?"ok":""}">${a.paid?(dl&&/^https:\/\//.test(dl.link)?`<a href="${e(dl.link)}" target="_blank" rel="noopener"><b>Download your file</b></a>`:"Payment received. Your file will appear here when it is ready."):"Your file will be available here after payment is confirmed."}</div><button class="btn o" id="cl">Close</button>`;
$("#ov").classList.add("on")}
/* ---- Events ---- */
document.addEventListener("click",async x=>{const t=x.target.closest("[data-t],[data-v],#out,#cl");if(!t)return;
if(t.dataset.t){S.tab=t.dataset.t;S.msg="";authScreen()}else if(t.dataset.v)detail(t.dataset.v);else if(t.id==="out")API.signOut();else if(t.id==="cl")$("#ov").classList.remove("on")});
document.addEventListener("input",x=>{if(x.target.id==="aq"){S.q=x.target.value;const p=x.target.selectionStart;adminScreen().then(()=>{const i=$("#aq");i.focus();i.setSelectionRange(p,p)})}});
document.addEventListener("change",x=>{if(x.target.id==="af2"){S.f=x.target.value;adminScreen()}});
document.addEventListener("submit",async x=>{x.preventDefault();const f=x.target,d=Object.fromEntries(new FormData(f));
try{if(f.id==="af"){S.msg="";if(S.tab==="signup")await API.signUp(d);else{S.expect=S.tab==="admin"?"admin":"";await API.signIn(d.email.trim().toLowerCase(),d.pw)}}
else if(f.id==="nf"){const p=await API.profile(U.uid),a={id:"BEC-APP-"+Date.now().toString(36).toUpperCase(),uid:U.uid,email:U.email,name:p.name||"",org:p.org||"",phone:p.phone||"",service:d.service,state:d.state,category:d.category,details:d.details,docs:d.docs||"",status:"Submitted",remarks:"",quote:"",paid:false,created:Date.now()};await API.createApp(a);
if(NOTIFY)fetch(NOTIFY,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({_subject:"New portal application "+a.id,email:a.email,name:a.name,organisation:a.org,phone:a.phone,service:a.service,state:a.state,message:a.details})}).catch(()=>{});S.msg="Application "+a.id+" submitted. We will review it and update the status here.";clientScreen()}
else if(f.id==="uf"){await API.update(f.dataset.id,{status:d.status,quote:d.quote,remarks:d.remarks,paid:!!d.paid});if(d.link&&/^https:\/\//.test(d.link))await API.setDelivery(f.dataset.id,f.dataset.uid,d.link);$("#ov").classList.remove("on");adminScreen()}}
catch(err){const m=(err&&err.message)||"Something went wrong. Try again.";if(f.id==="af"){S.msg=m;authScreen()}else alert(m)}});
(async()=>{const live=CFG.apiKey&&window.firebase;API=live?FB:DM;if(!live)$("#demo").hidden=false;API.init();API.on(u=>{U=u;go()})})();
</script></body></html>
