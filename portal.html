<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEC Store | Bharat Environment Consultants</title><meta name="robots" content="noindex,nofollow">
<style>
:root{--nav:#131921;--nav2:#232f3e;--or:#ff9900;--or2:#febd69;--bg:#eaeded;--ink:#0f1111;--mute:#565959;--line:#d5d9d9;--link:#007185;--bad:#b12704;--ok:#067d62}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--link)}h1{font-size:1.5rem;margin:0 0 12px}h2{font-size:1.1rem;margin:0 0 10px}
.top{background:var(--nav);color:#fff;display:flex;gap:14px;align-items:center;padding:10px 3vw;flex-wrap:wrap}
.brand{color:#fff;text-decoration:none;font-size:1.4rem}.brand b{color:var(--or)}
.srch{flex:1;display:flex;min-width:200px}.srch input{flex:1;border:0;border-radius:6px 0 0 6px;padding:10px}.srch button{border:0;background:var(--or2);border-radius:0 6px 6px 0;padding:0 16px;cursor:pointer;font-weight:700}
body:not(.cust) .srch{display:none}
#nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem}#nav a,#nav button{color:#fff;text-decoration:none;background:none;border:1px solid transparent;padding:6px 10px;border-radius:4px;cursor:pointer;font:inherit}#nav a:hover,#nav button:hover{border-color:#fff}
main{max-width:1200px;margin:0 auto;padding:20px 3vw 60px}
.btn{background:var(--or2);border:1px solid #a88734;border-radius:20px;padding:7px 16px;cursor:pointer;font:inherit;color:var(--ink);text-decoration:none;display:inline-block}.btn:hover{filter:brightness(.95)}
.btn.buy{background:var(--or);border-color:#c88b1c}.btn.ghost{background:#fff;border-color:var(--line)}.btn.sm{padding:3px 12px}.btn.danger{background:#fff;color:var(--bad);border-color:#e3b3a6}.btn[disabled]{opacity:.5}
.card,.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
label{display:grid;gap:4px;font-weight:700;font-size:.85rem;margin-bottom:12px}label.chk{display:flex;gap:8px;align-items:center;font-weight:400}
input,select,textarea{font:inherit;padding:9px;border:1px solid #888;border-radius:4px;width:100%}input[type=checkbox]{width:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.hint{color:var(--mute);font-size:.8rem}
.auth{max-width:380px;margin:30px auto}.tabs{display:flex;margin-bottom:14px;border-bottom:1px solid var(--line)}.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:9px;font-weight:700;cursor:pointer}.tabs [aria-selected=true]{border-color:var(--or)}
.msg{background:#fcf4e3;padding:9px;border-radius:4px;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 14px;cursor:pointer}.chips [aria-pressed=true]{background:var(--nav2);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px}
.pi{height:140px;display:grid;place-items:center;font-size:4rem;background:#f7f8f8;border-radius:6px;overflow:hidden}.pi img{max-width:100%;max-height:100%}
.pr{font-size:1.2rem;font-weight:700}.pr small{font-size:.7rem;font-weight:400;color:var(--mute)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:.8rem;color:var(--mute)}.wrap{overflow-x:auto}tr[data-h]{cursor:pointer}tr[data-h]:hover{background:#f7f8f8}
.pill{background:#e7f4f1;color:var(--ok);padding:2px 10px;border-radius:12px;font-size:.78rem;font-weight:700;white-space:nowrap}.pill.w{background:#fcf4e3;color:#8a5a00}.pill.x{background:#fbe9e5;color:var(--bad)}
.two{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}.ln{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:10px 0}.ln .pi{width:70px;height:70px;font-size:2rem;flex:none}.ln>div:nth-child(2){flex:1}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer}
.tot{font-size:1.1rem;font-weight:700}.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.kpi div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px}.kpi b{display:block;font-size:1.5rem}
.track{list-style:none;display:flex;padding:0;margin:14px 0}.track li{flex:1;text-align:center;font-size:.75rem;color:var(--mute);position:relative;padding-top:24px}
.track li:before{content:"";position:absolute;top:4px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#fff;border:2px solid var(--line);z-index:1}.track li:after{content:"";position:absolute;top:10px;left:-50%;width:100%;height:3px;background:var(--line)}.track li:first-child:after{display:none}
.track .d:before{background:var(--ok);border-color:var(--ok)}.track .d:after{background:var(--ok)}.track .d{color:var(--ink);font-weight:700}.track time{display:block;font-weight:400}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--nav2);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:.2s}#toast.on{opacity:1}#toast.bad{background:var(--bad)}
.demo{background:#fcf4e3;padding:7px 3vw;font-size:.82rem}
@media(max-width:800px){.two{grid-template-columns:1fr}.row{grid-template-columns:1fr}.track{flex-direction:column}.track li{text-align:left;padding:0 0 12px 26px}.track li:before{top:2px;left:0;margin:0}.track li:after{display:none}}
</style></head><body>
<div id="demo" class="demo" hidden><b>Demo mode.</b> Data stays in this browser. Demo admin: admin@demo.local / admin123. Add your Firebase configuration to go live.</div>
<header class="top"><a class="brand" href="#/">BEC <b>Store</b></a><form id="sq" class="srch"><input id="q" placeholder="Search products" aria-label="Search products"><button>Search</button></form><nav id="nav"></nav></header>
<main id="app"></main><div id="toast" role="status" aria-live="polite"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
/* SETUP: paste your Firebase web config. Empty = demo mode (localhost / local file only).
   Administrators: create a document at admins/{their UID} in Firestore. Same login page for everyone. */
const CFG={apiKey:"",authDomain:"",projectId:"",appId:""};
const ST=["Placed","Packed","Shipped","Out for delivery","Delivered"];
const SEED=[["Reusable steel water bottle","Home",499,"🍶",50],["Bamboo toothbrush (pack of 4)","Personal care",199,"🪥",120],["Compost bin 20 L","Garden",1299,"🗑️",25],["Solar LED lantern","Electronics",899,"🔦",40],["Cotton shopping bag","Home",149,"👜",200],["Neem soil conditioner 5 kg","Garden",349,"🌱",60]];
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
const SD=SEED.map(([name,cat,price,emoji,stock])=>({id:slug(name),name,cat,price,emoji,stock,img:"",desc:""}));
const $=s=>document.querySelector(s);
const e=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=n=>"\u20B9"+Math.round(n||0).toLocaleString("en-IN");
const dt=n=>n?new Date(n).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const okUrl=u=>/^https:\/\//i.test(String(u||"").trim());
const toast=(m,b)=>{const t=$("#toast");t.textContent=m;t.className="on"+(b?" bad":"");clearTimeout(toast.t);toast.t=setTimeout(()=>t.className="",4000)};
const ERR={"auth/invalid-credential":"Email or password is incorrect.","auth/wrong-password":"Email or password is incorrect.","auth/user-not-found":"Email or password is incorrect.","auth/email-already-in-use":"This email is already registered. Sign in instead.","auth/weak-password":"Use a password of at least 8 characters.","permission-denied":"You do not have permission to do that."};
const msg=x=>ERR[x&&x.code]||(x&&x.message)||"Something went wrong.";
const img=p=>`<div class="pi">${okUrl(p.img)?`<img src="${e(p.img)}" alt="">`:e(p.emoji||"📦")}</div>`;

/* ---- backends ---- */
const FB={init(){firebase.initializeApp(CFG);this.a=firebase.auth();this.d=firebase.firestore()},
onAuth(cb){this.a.onAuthStateChanged(u=>cb(u?{uid:u.uid,email:(u.email||"").toLowerCase()}:null))},
async signUp(m,p){const c=await this.a.createUserWithEmailAndPassword(m,p);return{uid:c.user.uid,email:m}},
signIn(m,p){return this.a.signInWithEmailAndPassword(m,p)},signOut(){return this.a.signOut()},
async get(c,id){try{const s=await this.d.collection(c).doc(id).get();return s.exists?s.data():null}catch(x){if(x.code==="permission-denied")return null;throw x}},
set(c,id,v){return this.d.collection(c).doc(id).set(v)},upd(c,id,p){return this.d.collection(c).doc(id).update(p)},del(c,id){return this.d.collection(c).doc(id).delete()},
async list(c,f){let q=this.d.collection(c);if(f)q=q.where(f[0],"==",f[1]);return(await q.get()).docs.map(x=>({id:x.id,...x.data()}))}};
const DM={K:"bec_store_demo",
load(){try{const d=JSON.parse(localStorage.getItem(this.K));if(d)return d}catch(x){}const p={};SD.forEach(s=>p[s.id]=s);return{users:[{uid:"A1",email:"admin@demo.local",pw:"admin123"}],data:{admins:{A1:{}},products:p},sess:null}},
save(d){localStorage.setItem(this.K,JSON.stringify(d))},init(){},
onAuth(cb){this.cb=cb;const d=this.load(),u=d.users.find(x=>x.uid===d.sess);cb(u?{uid:u.uid,email:u.email}:null)},
async signUp(m,p){const d=this.load();if(d.users.some(x=>x.email===m))throw{code:"auth/email-already-in-use"};const u={uid:"U"+Date.now().toString(36),email:m,pw:p};d.users.push(u);d.sess=u.uid;this.save(d);return{uid:u.uid,email:m}},
async signIn(m,p){const d=this.load(),u=d.users.find(x=>x.email===m&&x.pw===p);if(!u)throw{code:"auth/invalid-credential"};d.sess=u.uid;this.save(d);this.cb({uid:u.uid,email:u.email})},
async signOut(){const d=this.load();d.sess=null;this.save(d);this.cb(null)},
async get(c,id){return(this.load().data[c]||{})[id]||null},
async set(c,id,v){const d=this.load();(d.data[c]=d.data[c]||{})[id]=JSON.parse(JSON.stringify(v));this.save(d)},
async upd(c,id,p){const d=this.load();Object.assign(d.data[c][id],JSON.parse(JSON.stringify(p)));this.save(d)},
async del(c,id){const d=this.load();delete(d.data[c]||{})[id];this.save(d)},
async list(c,f){return Object.entries(this.load().data[c]||{}).map(([id,v])=>({id,...v})).filter(x=>!f||x[f[0]]===f[1])}};

/* ---- state ---- */
let API,U=null,P=[],RT=0,CART={};
const S={tab:"in",q:"",cat:"",of:""};
try{CART=JSON.parse(localStorage.getItem("bec_cart"))||{}}catch(x){}
const saveCart=()=>{try{localStorage.setItem("bec_cart",JSON.stringify(CART))}catch(x){}};
const lines=()=>Object.keys(CART).map(id=>({p:P.find(x=>x.id===id),q:CART[id]})).filter(l=>l.p);
const cartN=()=>lines().reduce((t,l)=>t+l.q,0),cartT=()=>lines().reduce((t,l)=>t+l.q*l.p.price,0);
const pill=s=>`<span class="pill${s==="Cancelled"?" x":s==="Placed"?" w":""}">${e(s)}</span>`;
const route=()=>{const p=location.hash.replace(/^#\/?/,"").split("/");return{v:p[0]||"",id:decodeURIComponent(p[1]||"")}};

async function boot(au){
 U={uid:au.uid,email:au.email,admin:false,profile:{}};
 try{U.admin=!!(await API.get("admins",au.uid));U.profile=(await API.get("users",au.uid))||{};P=await API.list("products");P.sort((a,b)=>a.name.localeCompare(b.name))}catch(x){toast(msg(x),true)}
 render();
}

/* ---- views ---- */
function header(){
 document.body.className=U&&!U.admin?"cust":"";
 $("#nav").innerHTML=!U?"":U.admin?`<a href="#/">Orders</a><a href="#/products">Products</a><span>${e(U.email)} (admin)</span><button data-a="out">Sign out</button>`
  :`<a href="#/orders">Orders</a><a href="#/cart">&#128722; Cart (${cartN()})</a><span>${e(U.profile.name||U.email)}</span><button data-a="out">Sign out</button>`;
}
function authView(){
 const up=S.tab==="up";
 return`<div class="box auth"><h1>${up?"Create account":"Sign in"}</h1><div class="tabs" role="tablist"><button role="tab" data-a="tab" data-v="in" aria-selected="${!up}">Sign in</button><button role="tab" data-a="tab" data-v="up" aria-selected="${up}">Create account</button></div>
<p id="am" class="msg" role="alert" hidden></p><form id="af">${up?`<label>Full name<input name="name" required autocomplete="name"></label><label>Mobile number<input name="phone" type="tel" required autocomplete="tel"></label>`:""}
<label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password${up?" (min 8 characters)":""}<input name="pw" type="password" required minlength="${up?8:1}" autocomplete="${up?"new-password":"current-password"}"></label>
<button class="btn buy" style="width:100%">${up?"Create your account":"Sign in"}</button></form><p class="hint">Customers and store administrators use this same page. Administrators see the admin tools automatically after signing in.</p></div>`;
}
function shopView(){
 const q=S.q.toLowerCase(),cats=[...new Set(P.map(p=>p.cat).filter(Boolean))],r=P.filter(p=>(!S.cat||p.cat===S.cat)&&(!q||(p.name+" "+p.cat+" "+p.desc).toLowerCase().includes(q)));
 return`<h1>Shop</h1><div class="chips"><button data-a="cat" data-v="" aria-pressed="${!S.cat}">All</button>${cats.map(c=>`<button data-a="cat" data-v="${e(c)}" aria-pressed="${S.cat===c}">${e(c)}</button>`).join("")}</div>
${r.length?`<div class="grid">${r.map(p=>`<div class="p">${img(p)}<b>${e(p.name)}</b><span class="hint">${e(p.cat)}</span>${p.desc?`<span class="hint">${e(p.desc)}</span>`:""}<span class="pr">${inr(p.price)} <small>incl. taxes</small></span>${p.stock>0?`<span class="ok">${p.stock<=5?"Only "+p.stock+" left":"In stock"}</span><button class="btn" data-a="add" data-id="${e(p.id)}">Add to cart</button>`:`<span class="bad">Out of stock</span>`}</div>`).join("")}</div>`:`<div class="card">No products found.</div>`}`;
}
function cartView(){
 const l=lines();if(!l.length)return`<div class="card"><h1>Your cart is empty</h1><a class="btn buy" href="#/">Continue shopping</a></div>`;
 return`<div class="two"><div class="card"><h1>Shopping cart</h1>${l.map(({p,q})=>`<div class="ln">${img(p)}<div><b>${e(p.name)}</b><br><span class="hint">${inr(p.price)} each</span></div><span class="qty"><button data-a="dec" data-id="${e(p.id)}" aria-label="Decrease">&minus;</button>${q}<button data-a="inc" data-id="${e(p.id)}" aria-label="Increase">+</button></span><b>${inr(p.price*q)}</b><button class="btn danger sm" data-a="rm" data-id="${e(p.id)}">Delete</button></div>`).join("")}</div>
<div class="card"><p class="tot">Subtotal (${cartN()} items): ${inr(cartT())}</p><a class="btn buy" href="#/checkout">Proceed to checkout</a></div></div>`;
}
function checkoutView(){
 if(!lines().length)return cartView();const p=U.profile||{};
 return`<div class="two"><form id="cf" class="card"><h1>Checkout</h1><h2>Delivery address</h2><div class="row"><label>Full name<input name="name" value="${e(p.name)}" required></label><label>Mobile number<input name="phone" type="tel" value="${e(p.phone)}" required></label></div>
<label>Address<textarea name="addr" rows="3" required maxlength="500" placeholder="House, street, city, state, PIN"></textarea></label><h2>Payment</h2>
<label class="chk"><input type="radio" name="pay" value="Cash on delivery" checked> Cash on delivery</label><label class="chk"><input type="radio" name="pay" value="UPI on delivery"> UPI on delivery</label><button class="btn buy">Place your order</button></form>
<div class="card"><h2>Order summary</h2>${lines().map(({p,q})=>`<div>${e(p.name)} &times; ${q}</div>`).join("")}<p class="tot">Order total: ${inr(cartT())}</p></div></div>`;
}
async function ordersView(){
 const o=await API.list("orders",U.admin?null:["uid",U.uid]);o.sort((a,b)=>b.created-a.created);
 let h="";
 if(U.admin){const rev=o.filter(x=>x.status!=="Cancelled").reduce((t,x)=>t+x.total,0);
  h=`<h1>Orders</h1><div class="kpi"><div><b>${o.length}</b>Total orders</div><div><b>${o.filter(x=>x.status==="Placed").length}</b>New</div><div><b>${o.filter(x=>["Packed","Shipped","Out for delivery"].includes(x.status)).length}</b>In transit</div><div><b>${inr(rev)}</b>Sales</div></div>
<label style="max-width:240px">Filter by status<select id="of"><option value="">All</option>${[...ST,"Cancelled"].map(s=>`<option${S.of===s?" selected":""}>${s}</option>`).join("")}</select></label>`;
 }else h=`<h1>Your orders</h1>`;
 const r=o.filter(x=>!S.of||!U.admin||x.status===S.of);
 return h+(r.length?`<div class="card wrap"><table><thead><tr><th>Order</th>${U.admin?"<th>Customer</th>":""}<th>Items</th><th>Total</th><th>Status</th></tr></thead><tbody>${r.map(x=>`<tr data-h="#/order/${e(x.id)}"><td><a href="#/order/${e(x.id)}">${e(x.id)}</a><br><span class="hint">${dt(x.created)}</span></td>${U.admin?`<td>${e(x.name)}<br><span class="hint">${e(x.email)}</span></td>`:""}<td>${x.items.map(i=>e(i.name)+" &times; "+i.q).join("<br>")}</td><td>${inr(x.total)}</td><td>${pill(x.status)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="card">No orders yet. <a href="#/">Start shopping</a></div>`);
}
async function orderView(id){
 const o=await API.get("orders",id);if(!o||(!U.admin&&o.uid!==U.uid))return`<div class="card">Order not found. <a href="#/orders">Back</a></div>`;
 const h=o.history||[],i=ST.indexOf(o.status);
 const trk=o.status==="Cancelled"?`<p>${pill("Cancelled")}</p>`:`<ol class="track">${ST.map((s,k)=>{const x=h.find(z=>z.s===s);return`<li class="${k<=i?"d":""}">${s}${x?`<time>${dt(x.at)}</time>`:""}</li>`}).join("")}</ol>`;
 const side=U.admin?`<form id="mf" class="card" data-id="${e(o.id)}"><h2>Update order</h2><label>Status<select name="status">${[...ST,"Cancelled"].map(s=>`<option${s===o.status?" selected":""}>${s}</option>`).join("")}</select></label><button class="btn buy">Save status</button></form>`
  :`<div class="card"><h2>Need to change this?</h2>${o.status==="Placed"?`<button class="btn danger" data-a="cancel" data-id="${e(o.id)}">Cancel order</button>`:`<p class="hint">Orders can be cancelled only before they are packed.</p>`}</div>`;
 return`<p><a href="#/${U.admin?"":"orders"}">&larr; Back to orders</a></p><div class="two"><div><div class="card"><h1>Order ${e(o.id)}</h1><p>Placed ${dt(o.created)} ${pill(o.status)}</p>${trk}</div>
<div class="card"><h2>Items</h2>${o.items.map(it=>`<div class="ln"><div class="pi">${okUrl(it.img)?`<img src="${e(it.img)}" alt="">`:e(it.emoji||"📦")}</div><div><b>${e(it.name)}</b><br>${inr(it.price)} &times; ${it.q}</div><b>${inr(it.price*it.q)}</b></div>`).join("")}<p class="tot">Total: ${inr(o.total)}</p></div></div>
<aside><div class="card"><h2>Delivery</h2><p style="white-space:pre-wrap">${e(o.name)}\n${e(o.phone)}\n${e(o.addr)}</p><p class="hint">Payment: ${e(o.pay)}${U.admin?"<br>Customer: "+e(o.email):""}</p></div>${side}</aside></div>`;
}
function productsView(){
 return`<h1>Products</h1><form id="pf" class="card"><h2 id="pfh">Add a product</h2><input type="hidden" name="pid"><div class="row"><label>Name<input name="name" required></label><label>Category<input name="cat" required></label></div>
<div class="row"><label>Price (&#8377;)<input name="price" type="number" min="0" step="1" required></label><label>Stock<input name="stock" type="number" min="0" step="1" required value="10"></label></div>
<div class="row"><label>Emoji (fallback picture)<input name="emoji" maxlength="4" value="📦"></label><label>Image link (https, optional)<input name="img" type="url"></label></div>
<label>Description<input name="desc" maxlength="200"></label><button class="btn buy">Save product</button> <button type="button" class="btn ghost" data-a="pclr">Clear</button>${P.length?"":` <button type="button" class="btn ghost" data-a="seed">Load sample products</button>`}</form>
<div class="card wrap"><table><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${e(p.emoji)} ${e(p.name)}</b><br><span class="hint">${e(p.cat)}</span></td><td>${inr(p.price)}</td><td>${e(p.stock)}</td><td style="white-space:nowrap"><button class="btn ghost sm" data-a="pe" data-id="${e(p.id)}">Edit</button> <button class="btn danger sm" data-a="pd" data-id="${e(p.id)}">Delete</button></td></tr>`).join("")}</tbody></table></div>`;
}
async function render(){
 const t=++RT;header();let h;
 if(!U){$("#app").innerHTML=authView();return}
 const r=route();
 try{
  if(r.v==="order")h=await orderView(r.id);
  else if(U.admin)h=r.v==="products"?productsView():await ordersView();
  else if(r.v==="cart")h=cartView();
  else if(r.v==="checkout")h=checkoutView();
  else if(r.v==="orders")h=await ordersView();

/* ---- actions ---- */
const authMsg=t=>{const m=$("#am");m.textContent=t;m.hidden=false};
async function auth(d){
 const em=d.email.trim().toLowerCase();
 if(S.tab==="up"){let au;try{au=await API.signUp(em,d.pw);await API.set("users",au.uid,{name:d.name.trim(),org:"",phone:d.phone.trim(),gstin:"",email:em,created:Date.now()})}finally{if(au){S.busy=0;await boot(au)}}}
 else await API.signIn(em,d.pw);
}
async function placeOrder(d){
 const l=lines(),t=Date.now();if(!l.length)return;
 const o={id:"ORD-"+t.toString(36).toUpperCase(),uid:U.uid,email:U.email,name:d.name.trim(),phone:d.phone.trim(),addr:d.addr.trim(),pay:d.pay,
  items:l.map(({p,q})=>({id:p.id,name:p.name,price:p.price,q,emoji:p.emoji||"",img:okUrl(p.img)?p.img:""})),total:cartT(),status:"Placed",history:[{s:"Placed",at:t}],created:t};
 await API.set("orders",o.id,o);CART={};saveCart();toast("Order "+o.id+" placed. Thank you!");location.hash="#/order/"+o.id;
}
async function setStatus(id,s){
 const o=await API.get("orders",id),p={status:s};
 if(s!==o.status&&s!=="Cancelled")p.history=[...(o.history||[]).filter(x=>ST.indexOf(x.s)<ST.indexOf(s)),{s,at:Date.now()}];
 await API.upd("orders",id,p);toast("Order updated.");render();
}
async function saveProduct(d){
 const id=d.pid||slug(d.name)||"p-"+Date.now().toString(36);
 await API.set("products",id,{name:d.name.trim(),cat:d.cat.trim(),price:Math.max(0,Math.round(+d.price||0)),stock:Math.max(0,Math.round(+d.stock||0)),emoji:d.emoji||"📦",img:okUrl(d.img)?d.img.trim():"",desc:(d.desc||"").trim()});
 P=await API.list("products");P.sort((a,b)=>a.name.localeCompare(b.name));toast("Product saved.");render();
}
const chg=(id,n)=>{const p=P.find(x=>x.id===id);if(!p)return;const q=(CART[id]||0)+n;if(q<=0)delete CART[id];else CART[id]=Math.min(q,p.stock||q);saveCart();header();if(route().v==="cart")render()};

document.addEventListener("click",async x=>{
 const tr=x.target.closest("tr[data-h]");if(tr&&!x.target.closest("a,button")){location.hash=tr.dataset.h;return}
 const t=x.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 try{
  if(a==="tab"){S.tab=t.dataset.v;render()}
  else if(a==="out"){S.tab="in";location.hash="#/";await API.signOut()}
  else if(a==="cat"){S.cat=t.dataset.v;render()}
  else if(a==="add"){chg(id,1);toast("Added to cart.")}
  else if(a==="inc")chg(id,1);else if(a==="dec")chg(id,-1);
  else if(a==="rm"){delete CART[id];saveCart();render();header()}
  else if(a==="cancel"){if(confirm("Cancel this order?"))await setStatus(id,"Cancelled")}
  else if(a==="pe"){const p=P.find(z=>z.id===id),el=$("#pf").elements;el.pid.value=p.id;["name","cat","price","stock","emoji","img","desc"].forEach(k=>el[k].value=p[k]||"");$("#pfh").textContent="Edit product";el.name.focus()}
  else if(a==="pd"){if(confirm("Delete this product?")){await API.del("products",id);P=P.filter(z=>z.id!==id);render()}}
  else if(a==="pclr"){$("#pf").reset();$("#pf").elements.pid.value="";$("#pfh").textContent="Add a product"}
  else if(a==="seed"){await Promise.all(SD.map(s=>API.set("products",s.id,s)));P=await API.list("products");render()}
 }catch(err){toast(msg(err),true)}
});
document.addEventListener("change",x=>{if(x.target.id==="of"){S.of=x.target.value;render()}});
document.addEventListener("submit",async x=>{
 const f=x.target;x.preventDefault();const d=Object.fromEntries(new FormData(f)),b=f.querySelector("button:not([type])");
 if(f.id==="sq"){S.q=$("#q").value;if(route().v){location.hash="#/"}render();return}
 if(b)b.disabled=true;
 try{
  if(f.id==="af")await auth(d);else if(f.id==="cf")await placeOrder(d);
  else if(f.id==="mf")await setStatus(f.dataset.id,d.status);else if(f.id==="pf")await saveProduct(d);
 }catch(err){if(f.id==="af")authMsg(msg(err));else toast(msg(err),true)}
 finally{if(b)b.disabled=false}
});
window.addEventListener("hashchange",()=>{if(U){render();scrollTo(0,0)}});

(function(){
 const local=/^(localhost|127\.0\.0\.1|\[::1\])?$/.test(location.hostname),has=!!CFG.apiKey;
 if(has&&!window.firebase){$("#app").innerHTML=`<div class="box auth">Firebase failed to load. Reload the page.</div>`;return}
 if(!has&&!local){$("#app").innerHTML=`<div class="box auth">The store is not connected yet. Add the Firebase configuration to this page.</div>`;return}
 API=has?FB:DM;if(!has)$("#demo").hidden=false;API.init();
 API.onAuth(au=>{if(au)boot(au);else{U=null;render()}});
})();
</script></body></html>
