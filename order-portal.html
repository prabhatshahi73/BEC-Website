<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BEC Client Portal | Order environmental services online</title>
<!-- BEC ORDER PORTAL, server version. Needs functions/papi/[[path]].js and a D1 database bound as PDB. -->
<style>
:root{--g:#0b3b17;--g2:#14532d;--au:#c9a63f;--bg:#f3f6f2;--c:#fff;--b:#d5e0d7;--t:#1a2a1f;--m:#5b6b60;--hd:#0b3b17}
@media(prefers-color-scheme:dark){:root{--bg:#0e1511;--c:#16201a;--b:#27372c;--t:#e6eee8;--m:#9db0a3;--hd:#e6eee8}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:15px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--t)}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;color:var(--hd);margin:.4em 0}
header{background:var(--g);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 5vw;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--au)}
header b{font:700 1.15rem Georgia,serif}header b span{color:var(--au)}#who{font-size:.85rem;opacity:.85}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
nav a{color:#dfe9e0;text-decoration:none;padding:6px 10px;font-size:.9rem}nav a:hover{color:#fff;text-decoration:underline}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 16px;background:var(--au);color:#1b1500;font-weight:700;text-decoration:none;display:inline-block}
nav button{background:transparent;color:#fff;border:1px solid rgba(201,166,63,.55)}nav button.on{background:var(--au);color:#1b1500}
button.s{background:transparent;border:1px solid var(--au);color:var(--t)}button.sm{padding:4px 10px}
:focus-visible{outline:3px solid var(--au);outline-offset:2px}
main{max-width:1000px;margin:24px auto;padding:0 5vw 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:16px}
.m{color:var(--m)}.narrow{max-width:440px;margin:auto}
label{display:block;margin:10px 0;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:9px;margin-top:4px;font-weight:400;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tabs button{background:transparent;color:var(--t);border:1px solid var(--b)}.tabs button.on{background:var(--au);color:#1b1500;border-color:var(--au)}
.pill{background:var(--au);color:#1b1500;border-radius:99px;padding:2px 10px;font:600 .8rem system-ui;vertical-align:middle}
.tl{display:flex;gap:4px;margin:14px 0}.tl div{flex:1;padding:8px 4px;text-align:center;border-radius:6px;background:var(--c);border:1px solid var(--b);color:var(--m);font-size:.85rem}.tl .on{background:var(--g2);color:#fff;border-color:var(--g2)}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--b)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px}
.chat{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bb{padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--b);max-width:85%}.bb.c{align-self:flex-end}.bb.s{align-self:center;font-style:italic}.bb.a{background:var(--g2);color:#fff}.bb small{opacity:.75}
.ed{display:grid;grid-template-columns:2fr 1fr 70px 1fr auto;gap:6px;margin-bottom:8px;align-items:center}.ed input,.ed select{margin:0}
footer{text-align:center;color:var(--m);font-size:.8rem;padding:0 5vw 30px}
@media(max-width:700px){.ed{grid-template-columns:1fr 1fr}.tl{font-size:.75rem}}

/* signed-out landing layout */
main.land{max-width:none;margin:0;padding:0 0 40px}
.l-wrap{max-width:1180px;margin:0 auto;padding:0 5vw}
.l-hero{max-width:1180px;margin:0 auto;padding:44px 5vw 36px;display:grid;grid-template-columns:1.25fr 1fr;gap:44px;align-items:start}
.l-hero h1{font-size:2.2rem;line-height:1.15;margin:0 0 10px}
.l-lead{font-size:1.05rem;max-width:56ch;margin:0 0 24px}
.l-svc{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.l-svc .card{border-left:4px solid var(--au);padding:14px 16px}
.l-svc h3{margin:0 0 4px;font-size:1rem}.l-svc p{margin:0 0 8px;font-size:.9rem}
.l-card{position:sticky;top:76px;padding:22px}
.l-pw{position:relative;display:block}
.l-eye{position:absolute;right:4px;top:50%;transform:translateY(-45%);margin-top:2px;background:none;color:var(--g2);padding:6px 8px;font-size:.85rem}
@media(prefers-color-scheme:dark){.l-eye{color:var(--au)}}
.l-note{margin:16px 0 0;padding:10px 12px;background:var(--bg);border-radius:6px;font-size:.88rem;color:var(--m)}
.l-admin{display:block;margin-top:14px;font-size:.82rem;color:var(--m);text-align:center}
.l-trust{background:var(--g);color:#e6efe7}
.l-trust-in{max-width:1180px;margin:0 auto;padding:22px 5vw;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.l-trust strong{display:block;color:var(--au);font-family:Georgia,serif;font-size:1.05rem}.l-trust span{font-size:.88rem}
.l-sec{padding-top:48px;scroll-margin-top:70px}
.l-sec h2{font-size:1.55rem;margin:0 0 6px}.l-sec .sub{margin:0 0 20px;max-width:62ch}
.l-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s;padding:0;list-style:none;margin:0}
.l-steps li{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:18px;counter-increment:s}
.l-steps li::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--g2);color:#fff;font-weight:700;font-size:.9rem;margin-bottom:8px}
.l-steps b{display:block;font-family:Georgia,serif;color:var(--hd)}.l-steps span{font-size:.9rem;color:var(--m)}
.l-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px;align-items:start}
.l-two h3{margin-top:0}.l-two ul{margin:0;padding-left:18px}.l-two li{margin:6px 0}
.l-dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.l-dl dt{font-weight:600}.l-dl dd{margin:0}
details{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:0 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;padding:14px 0;color:var(--hd)}details p{margin:0 0 14px;color:var(--m)}
@media(max-width:900px){.l-hero{grid-template-columns:1fr;gap:26px;padding-top:26px}.l-card{position:static;order:-1}.l-trust-in,.l-steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.l-svc,.l-trust-in,.l-steps{grid-template-columns:1fr}.l-hero h1{font-size:1.75rem}nav a{display:none}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header><b>Bharat Environment <span>Consultants</span></b><span id="who"></span><nav id="nav"></nav></header>
<main id="app"></main>
<footer>Your orders, messages and reports are stored securely on the BEC server. Prices include 18% GST at checkout.</footer>
<script>
const CFG={rzpKey:"",createUrl:"/api/create-order",verifyUrl:"/api/verify-payment",gst:.18},K="bec_portal_v1";
/* Sign-in page content. Add details here; empty items are hidden. */
const SITE={
 contact:[["Phone",""],["Email",""],["WhatsApp",""]],
 offices:[["Head office","Gurugram, Haryana"],["Regional office","H. No. 100, Village Tiwarta, Post Office Tiwarta, Tehsil Hardibazar, District Korba, Chhattisgarh 495449"]],
 news:[],   /* e.g. [{t:"Headline",u:"https://...",d:"23 Oct 2026"}] */
 links:[]   /* extra resource links, e.g. [{t:"Guidebook: 17 Red Category industries",u:"https://..."}] */
};
let D={cat:[],orders:[]},me=null,V="cat",cart=[],am="cl";const save=()=>{};
const API=async(p,m="GET",b,q)=>{try{const r=await fetch("/papi"+p,{method:m,headers:b!==undefined?{"content-type":"application/json"}:{},body:b!==undefined?JSON.stringify(b):undefined,credentials:"same-origin"}),j=await r.json().catch(()=>({}));if(!r.ok){if(!q)alert(j.error||"Something went wrong. Try again.");return null}return j}catch(_){if(!q)alert("Cannot reach the server. Check your connection and try again.");return null}};
const $=s=>document.querySelector(s),e=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN"),fd=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const O=id=>D.orders.find(o=>o.id==id),S=id=>D.cat.find(s=>s.id==id),isA=()=>me&&me.role=="admin";
const TL=["Ordered","Paid","In progress","Delivered"],ti=s=>({Paid:1,"In progress":2,Delivered:3}[s]||0);
const wd=(t,n)=>{let d=new Date(t);while(n>0){d.setDate(d.getDate()+1);if(d.getDay()%6)n--}return d.getTime()};
async function go(v){V=v;const[k,a]=v.split(":");if(me){const o=await API("/orders");if(o)D.orders=o;if(k=="o"){const x=await API("/orders/"+a);if(x){const i=D.orders.findIndex(y=>y.id==a);i<0?D.orders.push(x):D.orders[i]=x}}}if(!D.cat.length||k=="ac"||k=="cat"){const c=await API("/catalog");if(c)D.cat=c}draw()}
function draw(){
 const tabs=isA()?[["ao","Orders"],["ac","Catalogue"]]:[["cat","Services"],["cart","Cart ("+cart.length+")"],["ord","My orders"]];
 $("#nav").innerHTML=me?tabs.map(([v,t])=>`<button class="${V.split(":")[0]==v?"on":""}" onclick="go('${v}')">${t}</button>`).join("")+`<button onclick="out()">Sign out</button>`:`<a href="#services">Services</a><a href="#how">How it works</a><a href="#resources">Resources</a><a href="#support">Support</a><a href="#faq">FAQ</a>`;
 $("#who").textContent=me?me.name+(isA()?" (admin)":""):"";
 $("#app").className=me?"":"land";
 const [k,a]=V.split(":");
 $("#app").innerHTML=!me?authV():({cat:catV,cart:cartV,ord:listV,ao:listV,ac:edV,q:qV,o:oV}[k]||catV)(a);
}

/* ---------- signed-out landing page ---------- */
const svcL=()=>D.cat.length?`<div class="l-svc">${D.cat.map(s=>`<article class="card"><h3>${e(s.name)}</h3><p class="m">${e(s.d)}</p><b>${s.q?"Quote after scope review":inr(s.p)+" + GST"}</b><br><span class="m">About ${s.days} working days</span></article>`).join("")}</div>`:"";
const formL=()=>`<h2>${am=="ad"?"Administrator sign in":"Sign in to your portal"}</h2><div class="tabs"><button class="${am!="reg"?"on":""}" onclick="am='cl';draw()">Sign in</button><button class="${am=="reg"?"on":""}" onclick="am='reg';draw()">Create account</button></div>
${am=="reg"?`<label>Your name<input id="n" autocomplete="name"></label><label>Company<input id="c" autocomplete="organization"></label><label>Phone<input id="ph" type="tel" autocomplete="tel"></label>`:""}
<label>Email<input id="em" type="email" autocomplete="email"></label><label>Password<span class="l-pw"><input id="pw" type="password" autocomplete="${am=="reg"?"new-password":"current-password"}"><button type="button" class="l-eye" onclick="pwt(this)" aria-label="Show password">Show</button></span></label>
<button onclick="${am=="reg"?"reg()":"login()"}">${am=="reg"?"Create account":(am=="ad"?"Admin sign in":"Sign in")}</button>
<p class="l-note">All communication and delivery happen only on this portal.</p>
<a href="#" class="l-admin" onclick="am=am=='ad'?'cl':'ad';draw();return false">${am=="ad"?"Back to client sign in":"Administrator sign in"}</a>`;
function pwt(b){const p=$("#pw"),h=p.type=="password";p.type=h?"text":"password";b.textContent=h?"Hide":"Show";b.setAttribute("aria-label",h?"Hide password":"Show password")}
const resL=()=>{const L=[["Central Pollution Control Board (CPCB)","https://cpcb.nic.in"],["Ministry of Environment, Forest and Climate Change","https://moef.gov.in"],["National Green Tribunal (NGT)","https://greentribunal.gov.in"]].concat(SITE.links.map(x=>[x.t,x.u]));
 return `<div class="card"><h3>Regulation quick links</h3><ul>${L.map(x=>`<li><a href="${e(x[1])}" target="_blank" rel="noopener">${e(x[0])}</a></li>`).join("")}</ul></div>`+(SITE.news.length?`<div class="card"><h3>Latest from Bharat Environment News</h3><ul style="list-style:none;padding:0">${SITE.news.map(n=>`<li><a href="${e(n.u)}">${e(n.t)}</a>${n.d?`<br><span class="m">${e(n.d)}</span>`:""}</li>`).join("")}</ul></div>`:"")};
const supL=()=>{const R=SITE.contact.filter(x=>x[1]).concat(SITE.offices.filter(x=>x[1]));return `<div class="card"><h3>Contact</h3><dl class="l-dl">${R.map(x=>`<dt>${e(x[0])}</dt><dd>${e(x[1])}</dd>`).join("")}</dl></div><div class="card"><h3>Not sure which service you need?</h3><p class="m">Create an account and request a quote on any service. Describe your site or project and we will reply on the portal with a price and a delivery date.</p><a class="btn" href="#signin" onclick="am='reg';draw()">Create account</a></div>`};
const authV=()=>`<div class="l-hero"><div id="services" style="scroll-margin-top:80px"><h1>Order environmental compliance services online</h1><p class="m l-lead">Choose a service, pay or request a quote, track progress, and download your final report. Orders, messages and delivery all stay on this portal.</p>${svcL()}</div><aside class="card l-card" id="signin">${formL()}</aside></div>
<div class="l-trust"><div class="l-trust-in"><div><strong>Since 2005</strong><span>Environmental compliance consulting</span></div><div><strong>Public sector clients</strong><span>Including major PSUs</span></div><div><strong>NABL ULR compliance</strong><span>Test reports with ULR numbers</span></div><div><strong>Gurugram and Korba</strong><span>Head office and regional office</span></div></div></div>
<section class="l-sec" id="how"><div class="l-wrap"><h2>How ordering works</h2><p class="sub m">The same flow whether your service has a fixed price or needs a scope review first.</p><ol class="l-steps"><li><b>Choose a service</b><span>Add it to your cart, or request a quote for custom scope.</span></li><li><b>Pay or approve the quote</b><span>Pay for fixed-price services. For others, pay after you approve our quote.</span></li><li><b>Track progress</b><span>See status updates and message your consultant on the portal.</span></li><li><b>Download your report</b><span>The final report is uploaded to your order for download.</span></li></ol></div></section>
<section class="l-sec" id="resources"><div class="l-wrap"><h2>Resources</h2><p class="sub m">Official regulator websites and references from our team.</p><div class="l-two">${resL()}</div></div></section>
<section class="l-sec" id="support"><div class="l-wrap"><h2>Need help choosing?</h2><p class="sub m">Reach us or start with a quote request.</p><div class="l-two">${supL()}</div></div></section>
<section class="l-sec" id="faq"><div class="l-wrap"><h2>Frequently asked questions</h2><p class="sub"></p>
<details><summary>How do I pay?</summary><p>Online payment is being switched on. For now, pay by bank transfer or UPI and send your payment reference in Messages on your order. BEC then marks the order as paid and sets the delivery date.</p></details>
<details><summary>How is my work delivered?</summary><p>Your final report is uploaded to your order on the portal. Status updates and all messages with your consultant also stay there.</p></details>
<details><summary>How does a quote work?</summary><p>For services sold by quote, describe your project and send the request. We review the scope and reply on your order with a price and a delivery date.</p></details>
<details><summary>Can I order for more than one site or unit?</summary><p>Yes. Describe each site in your quote request and we will scope them together.</p></details>
<details><summary>What if I have a question during the work?</summary><p>Open your order and send a message. Your consultant replies there.</p></details>
</div></section>`;
document.addEventListener("keydown",ev=>{if(ev.key=="Enter"&&!me&&ev.target.tagName=="INPUT"){am=="reg"?reg():login()}});

/* ---------- original portal logic (unchanged) ---------- */
async function login(){const u=await API("/login","POST",{email:$("#em").value.trim(),pw:$("#pw").value,admin:am=="ad"});if(u)start(u)}
function start(u){me=u;go(isA()?"ao":"cat")}
async function reg(){const n=$("#n").value.trim(),pw=$("#pw").value;if(!n||!$("#em").value.trim()||pw.length<8)return alert("Enter your name, your email and a password of at least 8 characters.");const u=await API("/register","POST",{name:n,company:$("#c").value,phone:$("#ph").value,email:$("#em").value.trim(),pw});if(u)start(u)}
async function out(){await API("/logout","POST",{},1);me=null;cart=[];D.orders=[];V="cat";draw()}
const catV=()=>`<h1>Order environmental services</h1><p class="m">Choose a service, pay online, and follow the work here until your final report is delivered.</p><div class="grid">${D.cat.map(s=>`<div class="card"><h3>${e(s.name)}</h3><p class="m">${e(s.d)}</p><p><b>${s.q?"Quote after scope review":inr(s.p)}</b><br><span class="m">Delivery in about ${s.days} working days</span></p>${s.q?`<button onclick="go('q:${s.id}')">Request a quote</button>`:`<button onclick="add('${s.id}')">Add to cart</button>`}</div>`).join("")}</div>`;
const qV=id=>{const s=S(id);return `<div class="card narrow"><h2>Request a quote: ${e(s.name)}</h2><p class="m">Describe your site or project. We will reply here with a price and a delivery date.</p><label>Project details<textarea id="qd" rows="5"></textarea></label><button onclick="rq('${id}')">Send request</button> <button class="s" onclick="go('cat')">Back</button></div>`};
async function rq(id){const d=$("#qd").value.trim();if(!d)return alert("Describe your project so we can scope it.");const o=await API("/orders","POST",{quote:id,text:d});if(o)go("o:"+o.id)}
const add=id=>{const l=cart.find(c=>c.id==id);l?l.qty++:cart.push({id,qty:1});draw()};
const qty=(i,d)=>{cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);draw()};
const cartV=()=>{if(!cart.length)return `<div class="card narrow"><h2>Your cart is empty</h2><p class="m">Add a service to start an order.</p><button onclick="go('cat')">Browse services</button></div>`;const sub=cart.reduce((a,c)=>a+S(c.id).p*c.qty,0);return `<h1>Your cart</h1><div class="card">${cart.map((c,i)=>`<div class="line"><span>${e(S(c.id).name)}</span><span><button class="s sm" onclick="qty(${i},-1)">−</button> ${c.qty} <button class="s sm" onclick="qty(${i},1)">+</button></span><b>${inr(S(c.id).p*c.qty)}</b></div>`).join("")}<div class="line"><span>GST (${Math.round(CFG.gst*100)}%)</span><b>${inr(sub*CFG.gst)}</b></div><div class="line"><span>Total</span><b>${inr(sub*(1+CFG.gst))}</b></div></div><p class="m">Expected delivery: about ${Math.max(...cart.map(c=>S(c.id).days))} working days after payment.</p><button onclick="chk()">Pay and place order</button>`};
async function chk(){const o=await API("/orders","POST",{items:cart.map(c=>({id:c.id,qty:c.qty}))});if(o){cart=[];go("o:"+o.id)}}
const pay=()=>alert("Online payment is being switched on. For now, pay by bank transfer or UPI and send your payment reference in Messages. BEC will mark the order as paid.");
const listV=()=>{const L=D.orders.filter(o=>isA()||o.uid==me.id);return `<h1>${isA()?"All orders":"My orders"}</h1>`+(L.length?`<div class="grid">${L.map(o=>`<div class="card"><b>${o.id}</b> <span class="pill">${o.st}</span><p>${o.items.map(i=>e(i.name)).join(", ")}</p>${isA()?`<p class="m">${e(o.uname)}</p>`:""}<p class="m">${o.total?inr(o.total):"Awaiting quote"}</p>${o.due?`<p class="m">Due ${fd(o.due)}</p>`:""}<button class="s" onclick="go('o:${o.id}')">Open order</button></div>`).join("")}</div>`:`<p class="m">No orders yet.${isA()?"":" Choose a service to place your first order."}</p>`)};
const oV=id=>{const o=O(id);if(!o||(!isA()&&o.uid!=me.id))return `<p>Order not found.</p>`;const c={name:o.uname},i=ti(o.st),canPay=o.total&&(o.st=="Awaiting payment"||o.st=="Quote sent");
return `<button class="s sm" onclick="go('${isA()?"ao":"ord"}')">Back to orders</button><h1>${o.id} <span class="pill">${o.st}</span></h1>
<div class="tl">${TL.map((t,k)=>`<div class="${k<=i?"on":""}">${t}</div>`).join("")}</div>
<div class="two"><div class="card"><h3>Order</h3>${o.items.map(x=>`<div class="line"><span>${e(x.name)} × ${x.qty}</span><b>${x.p?inr(x.p*x.qty):""}</b></div>`).join("")}<div class="line"><span>Total with GST</span><b>${o.total?inr(o.total):"Quote pending"}</b></div>${o.due?`<p>Expected delivery: <b>${fd(o.due)}</b></p>`:`<p class="m">The delivery date is set once payment is received.</p>`}${o.pay?`<p class="m">Payment reference: ${e(o.pay)}</p>`:""}${!isA()&&canPay?`<button onclick="pay('${o.id}')">${o.st=="Quote sent"?"Accept quote and pay":"Pay now"}</button>`:""}</div>
<div class="card"><h3>Final report</h3>${o.rep?`<button onclick="dl('${o.id}')">Download ${e(o.rep.n)}</button>`:`<p class="m">Your report will appear here when the work is delivered.</p>`}${isA()?adm(o):""}</div></div>
<div class="card"><h3>Messages with ${isA()?e(c.name):"BEC consultants"}</h3><div class="chat">${o.msgs.map(m=>`<div class="bb ${m.f}"><small>${m.f=="s"?"Update":m.f=="a"?"BEC":e(c.name)}, ${fd(m.at)}</small><br>${e(m.t)}</div>`).join("")||`<p class="m">No messages yet. Ask your question here.</p>`}</div><textarea id="mt" rows="2" aria-label="Message"></textarea><button onclick="msg('${o.id}')">Send message</button></div>`};
const adm=o=>`<hr><h4>Admin actions</h4>${o.st=="Quote requested"?`<label>Quote amount before GST (₹)<input id="qa" type="number" min="0"></label><label>Delivery in working days<input id="qdays" type="number" min="1" value="${o.days}"></label><button onclick="sq('${o.id}')">Send quote</button>`:`<label>Status<select onchange="stt('${o.id}',this.value)">${["Quote sent","Awaiting payment","Paid","In progress","Delivered"].map(s=>`<option ${s==o.st?"selected":""}>${s}</option>`).join("")}</select></label>`}${o.due?`<label>Delivery date<input type="date" value="${new Date(o.due).toISOString().slice(0,10)}" onchange="dd('${o.id}',this.value)"></label>`:""}<label>Upload final report (up to 1 MB)<input type="file" onchange="up('${o.id}',this)"></label>`;
const A=async(id,p,b)=>{if(await API("/orders/"+id+"/"+p,"POST",b))go(V)};
function sq(id){const a=+$("#qa").value,d=+$("#qdays").value;if(!a||!d)return alert("Enter the quote amount and the delivery days.");A(id,"quote",{amount:a,days:d})}
const stt=(id,s)=>A(id,"status",{st:s});
const dd=(id,v)=>A(id,"due",{due:v});
function up(id,el){const f=el.files[0];if(!f)return;if(f.size>1e6)return alert("This file is larger than 1 MB. Use a smaller file.");const r=new FileReader();r.onload=()=>A(id,"report",{n:f.name,d:r.result});r.readAsDataURL(f)}
async function dl(id){const r=await API("/orders/"+id+"/report");if(r){const a=document.createElement("a");a.href=r.d;a.download=r.n;a.click()}}
function msg(id){const t=$("#mt").value.trim();if(t)A(id,"msg",{t})}
const edV=()=>`<h1>Catalogue and prices</h1><p class="m">Changes apply to new orders. Prices are before GST.</p><div class="card"><div class="ed m"><span>Service</span><span>Price (₹)</span><span>Days</span><span>Sold as</span><span></span></div>${D.cat.map((s,i)=>`<div class="ed"><input value="${e(s.name)}" onchange="ce(${i},'name',this.value)" aria-label="Name"><input type="number" value="${s.p}" onchange="ce(${i},'p',+this.value)" aria-label="Price"><input type="number" value="${s.days}" onchange="ce(${i},'days',+this.value)" aria-label="Days"><select onchange="ce(${i},'q',+this.value)" aria-label="Sold as"><option value="0" ${s.q?"":"selected"}>Fixed price</option><option value="1" ${s.q?"selected":""}>Quote</option></select><button class="s sm" onclick="D.cat.splice(${i},1);save();draw()">Remove</button></div>`).join("")}</div><p><button onclick="D.cat.push({id:'s'+Date.now(),name:'New service',d:'Describe this service.',p:0,days:7,q:1});save();draw()">Add service</button> <button onclick="savecat()">Save catalogue</button></p>`;
const ce=(i,k,v)=>{D.cat[i][k]=v};
async function savecat(){if(await API("/catalog","PUT",D.cat))alert("Catalogue saved.")}
(async()=>{const m=await API("/me","GET",undefined,1);if(m)me=m;go(isA()?"ao":"cat")})();
</script></body></html>
